      if (p1Lower === 'manhattan') finalP1Name = 'Stinky Man';
      if (p2Lower === 'manhattan') finalP2Name = 'Stinky Man';

      game.players[0].label = finalP1Name;
      game.players[1].label = finalP2Name;
      game.players[0].accent = selectedPlayerColors.p1;
      game.players[1].accent = selectedPlayerColors.p2;
      game.players[0].maxHp = startHp;
      game.players[0].hp = startHp;
      game.players[1].maxHp = startHp;
      game.players[1].hp = startHp;

      if (startHp === 2500) {
        game.players[0].handSize = 5;
        game.players[1].handSize = 5;
        // Redraw initial hands with new size
        game.players[0].hand = game.randomCards(5, "p1");
        game.players[1].hand = game.randomCards(5, "p2");
      }
      
      document.getElementById('name-setup').style.display = 'none';
      document.body.removeAttribute('data-screen'); // Remove setup screen background animation
      document.getElementById('board').style.display = 'block'; // Show board
      isNewTurn = true; // Trigger animation for the start of the game
      
      // If Henry, George, Abby, or Shae are playing, their secret advantage is handled inside the randomCards method
      // (They silently draw vastly better cards)

      // Randomize who goes first
      game.currentTurn = Math.random() < 0.5 ? "p1" : "p2";

      render();
      showTurnBanner(); 
    });

    window.addEventListener('mousemove', resetIdleTimer);
    window.addEventListener('touchstart', resetIdleTimer);
    window.addEventListener('keydown', resetIdleTimer);

    // --- Developer Options (Alt x 5) ---
    let altCount = 0;
    let altTimer;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Alt') {
        altCount++;
        clearTimeout(altTimer);
        altTimer = setTimeout(() => altCount = 0, 1000);
        if (altCount >= 5) {
          altCount = 0;
          const dev = document.getElementById('dev-options');
          dev.style.display = dev.style.display === 'none' ? 'block' : 'none';
        }
      }
    });

    // --- Background PS3 Ribbon & Particles Logic ---
    const initBgParticles = () => {
      const canvas = document.getElementById('bg-particles');
      const ctx = canvas.getContext('2d');
      
      let width, height;
      const resize = () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      };
      
      window.addEventListener('resize', resize);
      resize();

      let time = 0;
      const lightSources = [];
      const spawnLight = (light = null) => {
        const activeKey = document.body.getAttribute('data-active') || 'p1';
        const isP2 = activeKey === 'p2';
        let p1Color = selectedPlayerColors.p1;
        let p2Color = selectedPlayerColors.p2;
        if (typeof game !== 'undefined' && game.players && game.players[0].accent) {
           p1Color = game.players[0].accent;
           p2Color = game.players[1].accent;
        }
        // 85% chance to be the active player's color
        const favored = Math.random() < 0.85 ? (isP2 ? p2Color : p1Color) : (isP2 ? p1Color : p2Color);
        
        const baseHue = getHueFromHex(favored);
        const target = light || {};
        target.x = Math.random() * width;
        target.y = Math.random() * height;
        target.radius = Math.random() * 240 + 180;
        target.blurRadius = target.radius * (Math.random() * 0.8 + 0.9);
        target.hue = (baseHue + (Math.random() * 56 - 28) + 360) % 360;
        target.saturation = Math.random() * 22 + 64;
        target.lightness = Math.random() * 12 + 62;
        target.alpha = Math.random() * 0.2 + 0.12;
        target.life = Math.random() * 5400 + 5200;
        target.age = 0;
        target.driftX = (Math.random() - 0.5) * 0.07;
        target.driftY = (Math.random() - 0.5) * 0.07;
        return target;
      };

      for (let i = 0; i < 14; i++) {
        lightSources.push(spawnLight());
      }
      
      // Configuration for the ribbons (Light theme) - Ultra realistic organic flow
      const ribbons = [
        { color: 'rgba(0, 0, 0, 0.015)', offset: 0, amplitude: 220, speed: 0.0001, thickness: 250, waveComplexity: 0.0008 },
        { color: 'rgba(0, 0, 0, 0.02)', offset: 150, amplitude: 180, speed: 0.00015, thickness: 180, waveComplexity: 0.001 },
        { color: 'rgba(0, 0, 0, 0.025)', offset: 300, amplitude: 120, speed: 0.0002, thickness: 100, waveComplexity: 0.0012 },
        { color: 'rgba(0, 0, 0, 0.01)', offset: 450, amplitude: 280, speed: 0.00008, thickness: 300, waveComplexity: 0.0005 } // Deep background ribbon
      ];

      // Configuration for the rainbow particles - Realistic atmospheric dust/bokeh
      const jurassicEmojis = ['🦕', '🦖', '🌴', '🌋', '🦴'];
      const techEmojis = ['💻', '🎵', '🎶', '⌨️', '🎧', '⚡️', '0', '1'];
      const artEmojis = ['🎨', '🖌️', '🖼️', '🖍️', '✨'];
      const basketballEmojis = ['🏀', '⛹️‍♂️', '🏟️', '🔥'];
      const tiktokEmojis = ['📱', '🎵', '🤳', '✨', '🤍'];
      const theoEmojis = ['🌧️', '⛈️', '🎹', '🌩️', '☔️', '☁️'];
      const flaredEmojis = ['🥩', '🔥', '🍖', '🥓', '🍴'];
      const stinkyEmojis = ['💩', '🧦', '🧀', '🤢', '🦠'];

      const particles = [];
      for (let i = 0; i < 1000; i++) { // Massively increased count
        const size = Math.random() * 4 + 0.5;
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: size,
          // Parallax effect: smaller particles move slower, but overall much faster now
          dx: (Math.random() - 0.5) * (size * 0.15),
          dy: (Math.random() - 0.5) * (size * 0.15) - (size * 0.05), // Faster upward thermal drift
          vx: 0,
          vy: 0,
          hue: Math.random() * 360,
          baseOpacity: Math.random() * 0.15 + 0.05,
          pulseSpeed: Math.random() * 0.001 + 0.0005,
          pulseOffset: Math.random() * Math.PI * 2,
          wobbleSpeed: Math.random() * 0.004,
          wobbleOffset: Math.random() * Math.PI * 2,
          isHeart: Math.random() < 0.1, // 10% chance to be a heart or theme emoji
          emojiJurassic: jurassicEmojis[Math.floor(Math.random() * jurassicEmojis.length)],
          emojiTech: techEmojis[Math.floor(Math.random() * techEmojis.length)],
          emojiArt: artEmojis[Math.floor(Math.random() * artEmojis.length)],
          emojiBasketball: basketballEmojis[Math.floor(Math.random() * basketballEmojis.length)],
          emojiTiktok: tiktokEmojis[Math.floor(Math.random() * tiktokEmojis.length)],
          emojiTheo: theoEmojis[Math.floor(Math.random() * theoEmojis.length)],
          emojiFlared: flaredEmojis[Math.floor(Math.random() * flaredEmojis.length)],
          emojiStinky: stinkyEmojis[Math.floor(Math.random() * stinkyEmojis.length)]
        });
      }

      window.burstParticles = (originX, originY) => {
        particles.forEach(p => {
          const dx = p.x - originX;
          const dy = p.y - originY;
          const dist = Math.sqrt(dx*dx + dy*dy) || 1;
          // Add explosive force outwards from origin
          const force = (Math.random() * 4000 + 2000) / (dist * 0.1 + 1);
          p.vx += (dx / dist) * force;
          p.vy += (dy / dist) * force;
        });
      };

      const drawHeart = (ctx, x, y, size, hue, opacity) => {
        ctx.save();
        ctx.beginPath();
        const topCurveHeight = size * 0.3;
        ctx.moveTo(x, y + topCurveHeight);
        ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
        ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size + topCurveHeight) / 2, x, y + size);
        ctx.bezierCurveTo(x, y + (size + topCurveHeight) / 2, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
        ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
        ctx.closePath();
        
        const gradient = ctx.createRadialGradient(x, y + size/2, 0, x, y + size/2, size);
        gradient.addColorStop(0, `hsla(${hue}, 90%, 80%, ${opacity})`);
        gradient.addColorStop(0.5, `hsla(${hue}, 80%, 60%, ${opacity * 0.8})`);
        gradient.addColorStop(1, `hsla(${hue}, 90%, 50%, 0)`);
        
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.restore();
      };

      const drawLights = () => {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        lightSources.forEach(light => {
          light.age += 16;
          light.x += light.driftX;
          light.y += light.driftY;
          const lifeT = light.age / light.life;
          if (lifeT >= 1 || light.x < -300 || light.x > width + 300 || light.y < -300 || light.y > height + 300) {
            spawnLight(light);
          }
          const fade = Math.sin(Math.min(1, light.age / light.life) * Math.PI);
          const alpha = light.alpha * fade;
          const coreGradient = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, light.radius);
          coreGradient.addColorStop(0, `hsla(${light.hue}, ${light.saturation}%, ${light.lightness + 10}%, ${alpha})`);
          coreGradient.addColorStop(0.45, `hsla(${light.hue}, ${light.saturation}%, ${light.lightness}%, ${alpha * 0.6})`);
          coreGradient.addColorStop(1, `hsla(${light.hue}, ${light.saturation}%, ${light.lightness - 8}%, 0)`);
          ctx.fillStyle = coreGradient;
          ctx.beginPath();
          ctx.arc(light.x, light.y, light.radius, 0, Math.PI * 2);
          ctx.fill();
          const bloomGradient = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, light.blurRadius);
          bloomGradient.addColorStop(0, `hsla(${light.hue}, ${light.saturation}%, ${light.lightness + 18}%, ${alpha * 0.5})`);
          bloomGradient.addColorStop(1, `hsla(${light.hue}, ${light.saturation}%, ${light.lightness}%, 0)`);
          ctx.fillStyle = bloomGradient;
          ctx.beginPath();
          ctx.arc(light.x, light.y, light.blurRadius, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      };

      const drawRibbon = (ribbon) => {
        ctx.beginPath();
        
        // Draw the top edge of the ribbon
        for (let x = 0; x <= width; x += 15) { // Tighter step for smoother curves
          // Ultra realistic flow using 3 sine waves for organic chaotic movement
          const y = height / 2 
                  + Math.sin(x * ribbon.waveComplexity + time * ribbon.speed + ribbon.offset) * ribbon.amplitude
                  + Math.sin(x * (ribbon.waveComplexity * 0.7) + time * (ribbon.speed * 0.8)) * (ribbon.amplitude * 0.6)
                  + Math.cos(x * (ribbon.waveComplexity * 1.3) + time * (ribbon.speed * 1.2)) * (ribbon.amplitude * 0.3);
                  
          if (x === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }

        // Draw the bottom edge backwards to create a shape
        for (let x = width; x >= 0; x -= 15) {
          const y = height / 2 
                  + Math.sin(x * ribbon.waveComplexity + time * ribbon.speed + ribbon.offset) * ribbon.amplitude
                  + Math.sin(x * (ribbon.waveComplexity * 0.7) + time * (ribbon.speed * 0.8)) * (ribbon.amplitude * 0.6)
                  + Math.cos(x * (ribbon.waveComplexity * 1.3) + time * (ribbon.speed * 1.2)) * (ribbon.amplitude * 0.3)
                  + ribbon.thickness;
                  
          ctx.lineTo(x, y);
        }

        ctx.closePath();
        
        // Create a highly subtle, volumetric gradient for the ribbon
        const gradient = ctx.createLinearGradient(0, 0, width, height);
        gradient.addColorStop(0, ribbon.color);
        gradient.addColorStop(0.5, ribbon.color.replace(/0\.\d+\)/, '0.05)')); // Soft highlight in the middle
        gradient.addColorStop(1, ribbon.color.replace(/0\.\d+\)/, '0.01)')); // Fade out at the bottom
        
        ctx.fillStyle = gradient;
        ctx.fill();
      };

      const drawParticles = () => {
        const isShaeMode = document.body.classList.contains('shae-theme');
        const isJurassicMode = document.body.classList.contains('jurassic-theme');
        const isTechMode = document.body.classList.contains('tech-theme');
        const isArtMode = document.body.classList.contains('art-theme');
        const isBasketballMode = document.body.classList.contains('basketball-theme');
        const isTiktokMode = document.body.classList.contains('tiktok-theme');
        const isTheoMode = document.body.classList.contains('theo-theme');
        const isFlaredMode = document.body.classList.contains('flared-theme');
        const isStinkyMode = document.body.classList.contains('stinky-theme');
        
        particles.forEach(p => {
          // Calculate organic opacity pulsing
          const currentOpacity = p.baseOpacity + Math.sin(time * p.pulseSpeed + p.pulseOffset) * p.baseOpacity;
          if (currentOpacity <= 0.01) return; // Skip drawing if basically invisible

          // Add a slight horizontal wobble to simulate air currents
          const currentX = p.x + Math.sin(time * p.wobbleSpeed + p.wobbleOffset) * (p.r * 2);

          if (isShaeMode && p.isHeart) {
            // Force pink/purple hue for hearts in Shae mode, larger size
            const heartHue = Math.random() > 0.5 ? 330 : 300; 
            drawHeart(ctx, currentX, p.y, p.r * 8, heartHue, currentOpacity * 1.5);
          } else if ((isJurassicMode || isTechMode || isArtMode || isBasketballMode || isTiktokMode || isTheoMode) && p.isHeart) {
            ctx.save();
            ctx.globalAlpha = currentOpacity * 1.5;
            ctx.font = `${p.r * 6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            let text = '';
            if (isJurassicMode) text = p.emojiJurassic;
            else if (isTechMode) text = p.emojiTech;
            else if (isArtMode) text = p.emojiArt;
            else if (isBasketballMode) text = p.emojiBasketball;
            else if (isTiktokMode) text = p.emojiTiktok;
            else if (isTheoMode) text = p.emojiTheo;
            else if (isFlaredMode) text = p.emojiFlared;
            else if (isStinkyMode) text = p.emojiStinky;
            ctx.fillText(text, currentX, p.y);
            ctx.restore();
          } else {
            // Create a radial gradient for each particle to simulate out-of-focus bokeh
            const gradient = ctx.createRadialGradient(currentX, p.y, 0, currentX, p.y, p.r);
            
            let particleHue = p.hue;
            if (isShaeMode) particleHue = (p.hue % 60) + 280; 
            else if (isJurassicMode) particleHue = (p.hue % 40) + 80;
            else if (isTechMode) particleHue = (p.hue % 40) + 160;
            else if (isBasketballMode) particleHue = (p.hue % 30) + 20;
            else if (isTiktokMode) particleHue = Math.random() > 0.5 ? 180 : 330;
            else if (isTheoMode) particleHue = (p.hue % 30) + 210; // Stormy blues
            else if (isFlaredMode) particleHue = (p.hue % 30) + 0; // Meat reds
            else if (isStinkyMode) particleHue = (p.hue % 40) + 80; // Mossy greens

            gradient.addColorStop(0, `hsla(${particleHue}, 70%, 80%, ${currentOpacity})`);
            gradient.addColorStop(0.4, `hsla(${particleHue}, 80%, 60%, ${currentOpacity * 0.8})`);
            gradient.addColorStop(1, `hsla(${particleHue}, 90%, 50%, 0)`);

            ctx.beginPath();
            ctx.arc(currentX, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
          }

          p.x += p.dx + p.vx;
          p.y += p.dy + p.vy;
          
          // Apply friction to velocity so bursts slow down naturally
          p.vx *= 0.92;
          p.vy *= 0.92;

          p.hue += 0.05; // Extremely slow color shifting

          // Gentle wrap around with large buffer so they don't pop in/out
          if (p.x < -20) p.x = width + 20;
          if (p.x > width + 20) p.x = -20;
          if (p.y < -20) p.y = height + 20;
          if (p.y > height + 20) p.y = -20;
        });
      };

      const animateParticles = () => {
        ctx.clearRect(0, 0, width, height);
        
        // Ensure background is transparent so body gradient shows
        canvas.style.backgroundColor = 'transparent';
        
        drawLights();
        ribbons.forEach(ribbon => drawRibbon(ribbon));
        drawParticles();

        time += 16; // Approx 60fps delta
        requestAnimationFrame(animateParticles);
      };

      animateParticles();
    };

    // Preload images
    const preloadAssets = () => {
      slideshowImages.forEach(src => {
        const img = new Image();
        img.src = src;
      });
      const allCards = [
          "Assets/Cards/Damage/FemFemFemur.png",
          "Assets/Cards/Damage/SharkTooth.png",
          "Assets/Cards/Damage/TheBONE.png",
          "Assets/Cards/Damage/TriloBite.png",
          "Assets/Cards/Health/Fern.png",
          "Assets/Cards/Health/SaintGerken.png",
          "Assets/Cards/Magic/Javier.png",
          "Assets/Cards/Magic/JawiusJr.png",
          "Assets/Cards/Magic/SomeGirl.png",
          "Assets/Cards/Magic/Theodore.png",
          "Assets/Cards/Damage/BigS.png",
          "Assets/Cards/Damage/OneyPlays.png",
          "Assets/Cards/Damage/BigJohnAI.png"
      ];
      allCards.forEach(src => {
        const img = new Image();
        img.src = src;
      });
    };
    preloadAssets();

    // Initialize particles when script loads
    initBgParticles();

    render();
  </script>
</body>
</html>
